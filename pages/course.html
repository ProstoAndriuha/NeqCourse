<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Curs - NeqCourse</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <header>
        <h1><a href="/index.html"><i class="fas fa-graduation-cap"></i> NeqCourse</a></h1>
        <nav>
            <ul>
                <li><a href="/index.html">Acasă</a></li>
                <li><a href="/pages/courses.html" class="active">Cursuri</a></li>
                <li><a href="/pages/login.html">Autentificare</a></li>
                <li><a href="/pages/register.html">Înregistrare</a></li>
            </ul>
        </nav>
    </header>

    <main class="single-col dashboard-page">
        <section class="dashboard-hero">
            <div class="dashboard-hero-text">
                <p class="section-eyebrow">Curs live</p>
                <h2 id="course-title">Se încărcă cursul...</h2>
                <p id="course-teacher" class="dash-subtitle"></p>
                <p id="course-description"></p>
            </div>
            <div class="dashboard-hero-right">
                <span class="dash-role-badge">
                    <i class="fas fa-tag"></i>
                    <span id="course-price">--</span>
                </span>
            </div>
        </section>

        <section>
            <div class="section-heading-row">
                <div>
                    <p class="section-eyebrow">Checkout</p>
                    <h3><i class="fas fa-credit-card"></i> Acces la curs</h3>
                </div>
                <div id="course-action" class="btn-group"></div>
            </div>
            <p id="course-state">Se încărcă conținutul cursului...</p>
        </section>

        <section>
            <p class="section-eyebrow">Conținut</p>
            <h3><i class="fas fa-list-check"></i> Module și progres</h3>
            <div id="course-modules" class="dash-course-list"></div>
        </section>
    </main>

    <footer>
        <p class="footer-brand"><i class="fas fa-graduation-cap"></i> NeqCourse</p>
        <p class="footer-contact"><i class="fas fa-envelope"></i> contact@neqcourse.com</p>
        <p><a href="/pages/courses.html">< Înapoi la catalog</a></p>
        <p>&copy; 2026 NeqCourse. Toate drepturile rezervate.</p>
    </footer>

    <script src="/node_modules/gsap/dist/gsap.min.js"></script>
    <script src="/node_modules/gsap/dist/ScrollTrigger.min.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/course-detail.js"></script>
    <script src="/js/animations.js"></script>
</body>
</html>
